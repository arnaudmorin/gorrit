# gorrit configuration, lives at ~/.config/gorrit/config.toml

[gerrit]
url = "https://review.opendev.org"
username = "jdoe"
# HTTP token from Settings → HTTP Credentials on the Gerrit server.
token = "secret"

# External diff viewer for the `d` key, run through `sh -c` in a temporary
# directory. {old} and {new} expand to the before and after trees, {patch} to
# a unified patch file, {notes} to the inline comments in hunk's sidecar
# format. A command without placeholder receives the patch on stdin.
[diff]
command = "git diff --no-index --no-prefix {old} {new}"
# command = "hunk patch --agent-context {notes} {patch}"
# command = "delta --side-by-side"

# AI review for the `a` key, run through `sh -c` in the background in a
# temporary directory, with the same placeholders as [diff]. What it prints
# is the review; name labels it. Defaults to claude with the patch on stdin.
[review]
name = "claude"
command = "claude -p \"Review this Gerrit change, its patch is on stdin. Start with a short summary of the change and whether it deserves a +1, ending with a line Verdict: +1 or Verdict: -1. Then give each finding as its own paragraph starting with path:line: where line is in the new version of the file, most important first. Be concise and answer in plain text.\""

# Where "Closes-Bug: #123" footers link to; {id} is replaced.
[bugs]
url = "https://bugs.launchpad.net/bugs/{id}"

# Accounts whose messages count as automated, in addition to messages Gerrit
# tags as autogenerated and authors named "Something CI".
[messages]
bots = ["Zuul"]

# Tabs of the change list, one Gerrit query each. Any search operator works:
# https://gerrit-review.googlesource.com/Documentation/user-search.html
[[filters]]
name = "My changes"
query = "owner:self"

[[filters]]
name = "Reviewing"
query = "reviewer:self -owner:self"

[[filters]]
name = "Starred"
query = "is:starred"

[[filters]]
name = "Neutron"
query = "project:openstack/neutron OR project:openstack/neutron-lib"
